<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTILO DA ILHA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="promo-bar">Frete Grátis p/ todo BR compras acima de R$ 399,90</div>

    <div id="cart-drawer">
        <div class="p-8 pb-4 flex justify-between items-center border-b border-white/5">
            <h2 class="text-red-600 font-black text-2xl uppercase">Sacola</h2>
            <button onclick="toggleCart(false)" class="text-white text-xs border border-white/20 px-3 py-1 rounded">X</button>
        </div>
        
        <div class="cart-scroll-area custom-scroll">
            <div id="cart-items" class="mb-8"></div>
            
            <form id="checkout-form" class="space-y-6">
                <div>
                    <p class="text-[10px] font-black text-red-600 uppercase mb-3 tracking-widest">── Seus Dados ──</p>
                    <input type="text" id="cust-nome" placeholder="NOME COMPLETO" class="checkout-input" required>
                    <input type="tel" id="cust-tel" placeholder="WHATSAPP (DDD)" class="checkout-input" required>
                    <input type="text" id="cust-endereco" placeholder="ENDEREÇO (Rua, Número, Bairro)" class="checkout-input" required>
                </div>

                <div>
                    <p class="text-[10px] font-black text-red-600 uppercase mb-3 tracking-widest">── Entrega ──</p>
                    <label class="radio-card"><input type="radio" name="entrega" value="Retirar na loja" data-price="0" checked><span>Retirar na loja (Grátis)</span></label>
                    <label class="radio-card"><input type="radio" name="entrega" value="Entrega em casa" data-price="15"><span>Entrega em casa (+R$ 15,00)</span></label>
                </div>

                <div>
                    <p class="text-[10px] font-black text-red-600 uppercase mb-3 tracking-widest">── Pagamento ──</p>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="radio-card"><input type="radio" name="pagamento" value="PIX" checked><span>PIX</span></label>
                        <label class="radio-card"><input type="radio" name="pagamento" value="Dinheiro"><span>Dinheiro</span></label>
                    </div>
                </div>

                <div class="border-t border-white/10 pt-6">
                    <div class="flex justify-between text-2xl font-black mb-6 uppercase"><span>Total</span><span id="total-final" class="text-red-600">R$ 0,00</span></div>
                    <button type="submit" class="btn-red shadow-lg shadow-red-600/20">Finalizar no WhatsApp</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
