<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTILO DA ILHA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-black text-white antialiased">
    <div class="promo-bar">Frete Grátis p/ todo BR compras acima de R$ 399,90</div>

    <aside id="sidebar">
        <div class="p-8"><img src="assets/logo.PNG" class="h-16 mb-10"><nav id="sidebar-nav" class="flex flex-col gap-4"></nav></div>
    </aside>

    <div id="cart-drawer">... (mesma estrutura anterior) ...</div>
    <div id="menu-overlay"></div>

    <header>
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <button onclick="toggleMenu(true)" class="text-white text-2xl">☰</button>
            <img src="assets/logo.PNG" class="logo-img cursor-pointer" onclick="location.reload()">
            <button onclick="toggleCart(true)" class="relative">🛒<span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-[10px] w-5 h-5 flex items-center justify-center rounded-full">0</span></button>
        </div>
        <div class="max-w-xl mx-auto px-6 mt-4">
            <input type="text" id="search-input" placeholder="BUSCAR..." class="w-full bg-[#111] p-3 rounded-sm border border-white/10 text-[10px] font-bold">
        </div>
    </header>

    <div class="main-content">
        <section class="hero-container bg-[#050505] overflow-hidden">
            <div id="banner-slider" class="flex h-full transition-transform duration-700"></div>
        </section>
        <main id="product-grid" class="max-w-7xl mx-auto px-6 py-12 grid grid-cols-2 md:grid-cols-4 gap-8"></main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
