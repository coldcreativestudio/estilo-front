<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTILO DA ILHA | Streetwear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="antialiased">

    <div class="promo-bar">Frete Grátis p/ todo BR compras acima de R$ 399,90</div>

    <div id="image-modal" onclick="this.style.display='none'">
        <span id="close-modal">&times;</span>
        <img id="modal-img" src="" alt="Ampliado">
    </div>

    <aside id="sidebar">
        <div class="p-8 h-full flex flex-col">
            <div class="flex justify-between items-center mb-12">
                <img src="assets/logo.png" class="h-16 cursor-pointer" onclick="location.reload()">
                <button onclick="toggleMenu(false)" class="text-white text-[10px] font-black border border-white/20 px-3 py-1 rounded">FECHAR X</button>
            </div>
            <nav id="sidebar-nav" class="flex flex-col gap-6 flex-1 overflow-y-auto custom-scroll"></nav>
        </div>
    </aside>

    <div id="cart-drawer">
        <div class="p-8 pb-4 flex justify-between items-center">
            <h2 class="text-red-600 font-[900] text-2xl uppercase tracking-tighter">Sua Sacola</h2>
            <button onclick="toggleCart(false)" class="text-white text-[10px] font-black border border-white/20 px-3 py-1 rounded">FECHAR X</button>
        </div>
        <div class="cart-scroll-area custom-scroll">
            <div id="cart-items" class="space-y-4 mb-8"></div>
            <div class="border-t border-white/10 pt-6 mt-4 space-y-4">
                <div class="flex justify-between text-xs text-gray-400 font-bold uppercase"><span>Subtotal</span><span id="subtotal-val">R$ 0,00</span></div>
                <div class="flex justify-between text-xs text-gray-400 font-bold uppercase"><span>Frete</span><span id="frete-val">R$ 0,00</span></div>
                <div class="flex justify-between text-2xl font-[900] uppercase text-white mb-6"><span>Total</span><span id="total-final" class="text-red-600">R$ 0,00</span></div>
                <form id="checkout-form" class="space-y-6 pb-10">
                    <input type="text" id="cust-nome" placeholder="NOME COMPLETO" class="checkout-input" required>
                    <input type="tel" id="cust-tel" placeholder="WHATSAPP (DDD)" class="checkout-input" required>
                    <div class="space-y-2">
                        <p class="text-[9px] font-black text-red-600 uppercase tracking-widest">─── Entrega ───</p>
                        <label class="radio-card"><input type="radio" name="entrega" value="Retirar na loja" data-price="0" checked><span>Retirar na loja (Grátis)</span></label>
                        <label class="radio-card"><input type="radio" name="entrega" value="Entrega em casa" data-price="15"><span>Entrega em casa (+R$ 15,00)</span></label>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="radio-card"><input type="radio" name="pagamento" value="PIX" checked><span>PIX</span></label>
                        <label class="radio-card"><input type="radio" name="pagamento" value="Dinheiro"><span>Dinheiro</span></label>
                    </div>
                    <textarea id="cust-obs" placeholder="OBSERVAÇÕES..." class="checkout-input h-20 resize-none pt-4"></textarea>
                    <div class="flex gap-2">
                        <button type="button" onclick="clearCart()" class="flex-1 bg-white/10 py-4 rounded-xl font-black text-[10px]">CANCELAR</button>
                        <button type="submit" class="flex-[2] btn-red py-4 rounded-xl font-black text-[10px] tracking-widest">FINALIZAR NO WHATSAPP</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="menu-overlay"></div>

    <header>
        <div class="max-w-7xl mx-auto px-6 w-full flex justify-between items-center">
            <button onclick="toggleMenu(true)" class="text-white w-10 flex justify-start focus:outline-none">
                <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-16 6h16"></path></svg>
            </button>
            <div class="flex justify-center"><img src="assets/logo.png" class="logo-img cursor-pointer" onclick="location.reload()"></div>
            <button onclick="toggleCart(true)" class="relative w-10 flex justify-end focus:outline-none">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-red-600 text-[10px] font-black w-4 h-4 flex items-center justify-center rounded-full">0</span>
            </button>
        </div>
        <div class="max-w-xl mx-auto px-6 mt-4 w-full">
            <div class="flex bg-[#111] border border-white/10 rounded-sm overflow-hidden focus-within:border-red-600 transition">
                <input type="text" id="search-input" placeholder="O QUE VOCÊ ESTÁ BUSCANDO?" class="flex-1 bg-transparent p-3 text-[10px] font-bold outline-none text-white uppercase">
                <button class="bg-white text-black px-6 font-black text-[10px] hover:bg-red-600 hover:text-white transition">BUSCAR</button>
            </div>
        </div>
    </header>

    <div class="main-content">
        <section class="hero-container">
            <div id="banner-slider"></div>
            <div id="banner-dots" class="absolute bottom-6 w-full flex justify-center gap-2"></div>
        </section>
        <main id="product-grid" class="max-w-7xl mx-auto px-6 py-12 grid grid-cols-2 md:grid-cols-4 gap-8"></main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
