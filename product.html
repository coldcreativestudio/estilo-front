<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUTO | ESTILO DA ILHA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-black text-white antialiased">
    
    <header class="p-6 flex justify-between items-center border-b border-white/5">
        <button onclick="history.back()" class="text-white font-black text-xs uppercase">← Voltar</button>
        <img src="assets/logo.PNG" class="h-10 cursor-pointer" onclick="location.href='index.html'">
        <div class="w-10"></div>
    </header>

    <main id="product-detail" class="max-w-4xl mx-auto p-6 mt-10">
        <div class="animate-pulse flex flex-col md:flex-row gap-10">
            <div class="w-full aspect-square bg-[#111] rounded-3xl"></div>
            <div class="flex-1 space-y-4">
                <div class="h-4 bg-[#111] w-1/4"></div>
                <div class="h-8 bg-[#111] w-3/4"></div>
                <div class="h-20 bg-[#111] w-full"></div>
            </div>
        </div>
    </main>

    <script src="js/product.js"></script>
</body>
</html>
